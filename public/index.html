<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>خطة الإتقان | مسجد الخلافة الراشدة</title><style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1f2a24;--mut:#6b7770;--pri:#1f6b4f;--prit:#fff;--bd:#e1ddd0;--ok:#1f6b4f;--mid:#b7791f;--bad:#b4402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--tx:#e8efe9;--mut:#93a39a;--pri:#4fb98c;--prit:#0c1511;--bd:#2c3a33;--ok:#4fb98c;--mid:#e0a94a;--bad:#e5806f}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--tx:#e8efe9;--mut:#93a39a;--pri:#4fb98c;--prit:#0c1511;--bd:#2c3a33;--ok:#4fb98c;--mid:#e0a94a;--bad:#e5806f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.6}
header{background:var(--pri);color:var(--prit);padding:14px 16px;font-weight:700;font-size:18px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer}
button.on,button.p{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;color:#fff}
.g1{background:var(--ok)}.g2{background:var(--mid)}.g3{background:var(--bad)}
.next{border-inline-start:5px solid var(--pri)}
.mut{color:var(--mut);font-size:13px}
.rec{border-top:1px solid var(--bd);padding:10px 0}
.rec:first-of-type{border-top:0}
.hero{text-align:center;padding:26px 12px 16px}
.logo{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,var(--pri),#2f9d73);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 8px 24px rgba(31,107,79,.3)}
.hero h1{font-size:22px;margin:0 0 4px;line-height:1.5}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent}
.seg button.on{background:var(--pri);color:var(--prit)}
.field{position:relative}
.field .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%)}
.field input{padding-inline-start:38px;padding-block:12px}
.eye{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:6px}
.err{background:rgba(180,64,47,.12);color:var(--bad);padding:8px 10px;border-radius:9px;margin-top:10px;font-size:14px}
.big{width:100%;margin-top:14px;padding:13px;font-size:17px;font-weight:700}
.link{background:transparent;border:0;color:var(--pri);width:100%;margin-top:6px}

.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:rgba(31,107,79,.12);margin:10px 0}.danger{color:var(--bad)}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.nav button{flex:1;min-width:90px}.wide{width:100%}.small{font-size:12px}.record{padding:10px 0;border-bottom:1px solid var(--bd)}.card h3{margin-bottom:12px}input:disabled{opacity:.6}.brand-logo{width:42px;height:42px;object-fit:contain;border-radius:50%;background:white;vertical-align:middle;margin-left:9px}.hero .logo{width:100px;height:100px;background:white;overflow:hidden;padding:0}.hero .logo img{width:100%;height:100%;object-fit:contain}</style></head><body>

const firebaseConfig={apiKey:"AIzaSyDhh2xnXFKKiTMnk5MjAsy5hDaNPhcYcWg",authDomain:"khetat-alitqan.firebaseapp.com",projectId:"khetat-alitqan",storageBucket:"khetat-alitqan.firebasestorage.app",messagingSenderId:"332995262877",appId:"1:332995262877:web:8e5612063fe155c8219774"};

// STUDENT_LOGIN_V2
const studentLoginEmail=n=>{
 n=String(n).trim();
 if(!/^[0-9]{4,10}$/.test(n))throw Error('رقم الطالب يجب أن يتكون من 4 إلى 10 أرقام');
 return 'student-'+n+'@khetat-alitqan.firebaseapp.com';
};
function installStudentLogin(){
 const f=document.getElementById('login');if(!f)return;
 f.insertAdjacentHTML('afterend',`<form id="studentLoginForm" class="card"><h3>🎓 دخول الطالب</h3><label>رقم الطالب</label><input id="studentNumberLogin" inputmode="numeric" pattern="[0-9]{4,10}" required><label>كلمة المرور</label><input id="studentPasswordLogin" type="password" required><button class="p big">دخول الطالب</button><p id="studentLoginError" class="mut"></p></form>`);
 document.getElementById('studentLoginForm').onsubmit=async e=>{
  e.preventDefault();const msg=document.getElementById('studentLoginError');msg.textContent='';
  try{await signInWithEmailAndPassword(auth,studentLoginEmail(document.getElementById('studentNumberLogin').value),document.getElementById('studentPasswordLogin').value)}
  catch(err){console.error(err);msg.textContent='تعذّر الدخول. تأكد من الرقم وكلمة المرور.'}
 };
}
function renderStudentHome(){

 if(!profile.studentId){el.innerHTML='<div class="card">حساب غير مرتبط بسجل</div>';return}

  html+='<div class="card next"><h3>📌 الواجب القادم</h3>'+(last?'<p>حفظ: '+esc(last.as||'غير محدد')+' '+esc(last.af||'')+'–'+esc(last.at||'')+'</p><p>مراجعة: '+esc(last.rev||'غير محددة')+'</p>':'لا يوجد واجب بعد')+'</div>';

const sel=document.getElementById('studentSelect');if(sel)sel.onchange=()=>{selected=sel.value;render()};
if(chosen){document.getElementById('editstudent').onsubmit=async e=>{e.preventDefault();const name=v('editname');if(!name||name.length>120)return note('اسم الطالب مطلوب (حتى 120 حرفًا)',true);try{await updateDoc(doc(db,'students',chosen.uid),{name});note('تم تعديل الاسم')}catch(x){error(x)}};
document.getElementById('deletestudent').onclick=async()=>{if(!confirm('هل تريد حذف الطالب وجميع سجلاته نهائيًا؟'))return;try{await deleteDoc(doc(db,'students',chosen.uid));selected='';note('تم حذف الطالب')}catch(x){error(x)}};

const accountForm=document.getElementById('createStudentAccount');
if(accountForm)accountForm.onsubmit=async e=>{
 e.preventDefault();const number=v('studentNewNumber'),password=document.getElementById('studentNewPassword').value;
 if(password.length<8){note('كلمة المرور قصيرة',true);return}
 const button=accountForm.querySelector('button');button.disabled=true;let secondary=null,created=null,linked=false;
 try{
  const current=await getDoc(doc(db,'students',chosen.uid));
  if(!current.exists()||current.data().accountUid)throw Error('يوجد حساب مرتبط أو السجل غير موجود');
  secondary=initializeApp(firebaseConfig,'create-student-'+Date.now());
  const secondaryAuth=getAuth(secondary),email=studentLoginEmail(number);
  created=await createUserWithEmailAndPassword(secondaryAuth,email,password);
  const batch=writeBatch(db);
  batch.update(doc(db,'students',chosen.uid),{accountUid:created.user.uid});
  batch.set(doc(db,'users',created.user.uid),{uid:created.user.uid,name:chosen.name,email,role:'student',studentId:chosen.uid,studentNumber:number,createdAt:serverTimestamp()});
  await batch.commit();linked=true;
  note('تم إنشاء حساب الطالب. رقم الدخول: '+number);accountForm.reset();
 }catch(err){
  console.error(err);
  if(created&&!linked){try{await created.user.delete()}catch(cleanup){console.warn('Orphan Auth account may need removal in Firebase Console',cleanup)}}
  note(err.code==='auth/email-already-in-use'?'رقم الطالب مستخدم بالفعل':'تعذّر إنشاء الحساب: '+err.message,true);
 }finally{
  if(secondary){try{await signOut(getAuth(secondary))}catch(_){}await deleteApp(secondary).catch(()=>{})}
  button.disabled=false;
 }
};

const f=document.getElementById('addrec');f.onsubmit=async e=>{e.preventDefault();const r={date:new Date().toLocaleDateString('ar'),rs:v('rs'),rf:v('rf'),rt:v('rt'),grade:v('gr'),err:v('er'),ns:v('ns'),nf:v('nf'),nt:v('nt'),as:v('as'),af:v('af'),at:v('at'),rev:v('rv'),attendance:v('attendance'),note:v('note')};try{await updateDoc(doc(db,'students',chosen.uid),{records:[r,...(chosen.records||[])]});note('تم حفظ التسجيل')}catch(x){error(x)}}}}
out.onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{clearSubs();user=u;profile=null;students=[];people=[];selected='';page=u?'students':'home';if(!u)return login();el.innerHTML='<div class="card">جارٍ التحقق من الصلاحيات…</div>';try{const snap=await getDoc(doc(db,'users',u.uid));if(!snap.exists()){el.innerHTML=`<div class="card"><h3>الحساب بحاجة إلى تفعيل</h3><p>تم تسجيل الدخول، لكن لم يُنشأ ملف صلاحيات لهذا الحساب بعد.</p><div class="mut">UID: <code>${esc(u.uid)}</code></div><button id="signout">خروج</button></div>`;document.getElementById('signout').onclick=()=>signOut(auth);return}profile=snap.data();if(profile.role==='student'){renderStudentHome();return;}if(!['admin','teacher'].includes(profile.role))throw Error('هذا الإصدار مخصص للمدير والمحفّظ؛ دخول الطلاب لم يُفعّل بعد');const handleErr=x=>{console.error(x);note('فشل تحميل البيانات: '+x.message,true)};
if(profile.role==='admin'){unsubs.push(onSnapshot(collection(db,'users'),s=>{people=s.docs.map(d=>({uid:d.id,...d.data()}));render()},handleErr));unsubs.push(onSnapshot(collection(db,'students'),s=>{students=s.docs.map(d=>({uid:d.id,...d.data()}));render()},handleErr))}
else{unsubs.push(onSnapshot(query(collection(db,'students'),where('teacherId','==',u.uid)),s=>{students=s.docs.map(d=>({uid:d.id,...d.data()}));render()},handleErr))}
render()}catch(x){el.innerHTML=`<div class="card err">تعذر فتح الحساب: ${esc(x.message)}</div><button id="signout">خروج</button>`;document.getElementById('signout').onclick=()=>signOut(auth)}});
</script></body></html>
