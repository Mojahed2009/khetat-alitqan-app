name: Test Firestore Rules
on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'scripts/test-firestore.cjs'
      - '.github/workflows/test-firestore.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save @firebase/rules-unit-testing firebase
      - run: npx firebase-tools emulators:exec --only firestore --project demo-khetat-alitqan 'node scripts/test-firestore.cjs'
